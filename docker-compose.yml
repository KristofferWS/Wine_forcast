services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - wine_db:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/wine_quality.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/regions')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  wine_db:
